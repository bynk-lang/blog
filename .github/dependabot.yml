# Keeps the pinned GitHub Actions, the site's npm dependencies and the proxy
# Worker's current, as one grouped pull request each a week.
version: 2
# The site theme, @bynk-lang/site-theme, comes from GitHub Packages, which
# needs a token even to read. PACKAGES_READ_TOKEN is a Dependabot secret (set
# under Settings → Secrets and variables → Dependabot, not Actions) holding a
# classic personal access token with only the read:packages scope.
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.PACKAGES_READ_TOKEN}}
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    registries:
      - github-packages
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]
    # @astrojs/check (and the Volar packages under it) require typescript <7,
    # so hold TypeScript at 6.x until they support 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /proxy
    schedule:
      interval: weekly
    groups:
      proxy:
        patterns: ["*"]
