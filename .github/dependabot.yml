# Keeps the pinned GitHub Actions, the site's npm dependencies and the proxy
# Worker's current, as one grouped pull request each a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /proxy
    schedule:
      interval: weekly
    groups:
      proxy:
        patterns: ["*"]
