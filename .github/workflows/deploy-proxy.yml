# Deploy the /blog proxy Worker (proxy/) after CI passes on a push to main
# that changes it. The Worker serves bynk-lang.org/blog/ from the blog's Pages
# project; see proxy/README.md.
name: Deploy proxy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-proxy
  cancel-in-progress: false

jobs:
  decide:
    name: Should we deploy?
    # Only a green CI run for a push to this repository's own main, as in
    # deploy.yml. This job holds no checkout: it reads the commit's file list
    # from the API.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.changed.outputs.value }}
      sha: ${{ steps.changed.outputs.sha }}
    steps:
      - name: Does this commit change the proxy?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A missing or truncated file list (0, or the API's 300 cap) deploys
          # rather than risk skipping a change.
          resp=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}")
          count=$(printf '%s' "$resp" | jq '.files | length')
          if [ "$count" -eq 0 ] || [ "$count" -ge 300 ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(printf '%s' "$resp" | jq -r '.files[].filename')
          if printf '%s\n' "$files" | grep -qE '^(proxy/|\.github/workflows/deploy-proxy\.yml$)'; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::the proxy didn't change — skipping its deploy"
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy the Worker
    needs: decide
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: proxy
    steps:
      - name: Check for Cloudflare secrets
        id: gate
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      - run: npm ci
      - name: Deploy with wrangler
        if: steps.gate.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Note when deploy was skipped
        if: steps.gate.outputs.present == 'false'
        run: echo "::notice::Cloudflare secrets not set — skipped the Worker deploy. See proxy/README.md."
