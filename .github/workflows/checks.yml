# The blog's checks: the site type-checks and builds (with Astro's link and
# content checks),
# every ```bynk block in a post is still in the source it names (a showcase
# project, or another bynk-lang repository such as the starter),
# and the /blog proxy Worker type-checks, passes its tests and bundles.
# Called by ci.yml on every push and pull request, and by snippets-canary.yml
# when the showcase or the starter may have moved on.
name: Checks

on:
  workflow_call:
    inputs:
      showcase-ref:
        description: The bynk-lang/showcase ref to check snippets against (the starter is always checked at main).
        type: string
        default: main

permissions:
  contents: read
  # Read @bynk-lang/site-theme from GitHub Packages.
  packages: read

jobs:
  build:
    name: Type-check and build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Astro 7 floors Node at 22.12; the docs site builds on 24.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: npm
          # The site theme comes from GitHub Packages.
          registry-url: https://npm.pkg.github.com
          scope: "@bynk-lang"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `astro check` type-checks the config, the components and the .astro
      # files. The proxy has its own type check, below.
      - run: npm run check
      # Build the deploy's search config (the docs site's index merged, web
      # presence slice 7), so a config Starlight rejects fails here rather
      # than on main. The output isn't served, so the docs index needn't exist.
      - run: npm run build
        env:
          BYNK_MERGE_SEARCH: "1"
      # Search merges the docs site's Pagefind index (web presence slice 7), and
      # Pagefind loads it with this site's code, so the two should share a
      # minor version. A warning, not a failure: the docs site deploys on its own.
      - name: Pagefind matches the docs site's (warning only)
        run: |
          here=$(node -p "require('./node_modules/pagefind/package.json').version")
          if ! there=$(curl -fsS --max-time 20 https://bynk-lang.org/pagefind/pagefind-entry.json | node -pe "JSON.parse(require('fs').readFileSync(0)).version"); then
            echo "::warning::Could not read the docs site's Pagefind version from https://bynk-lang.org/pagefind/pagefind-entry.json"
          elif [ "$(echo "$here" | cut -d. -f1,2)" != "$(echo "$there" | cut -d. -f1,2)" ]; then
            echo "::warning::Pagefind here is $here, the docs site's is $there. Merged search needs the same minor version: bump the older site."
          else
            echo "Pagefind $here here, $there on the docs site."
          fi

  snippets:
    name: Snippets match their sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out bynk-lang/showcase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bynk-lang/showcase
          ref: ${{ inputs.showcase-ref }}
          path: .showcase
          persist-credentials: false
      - name: Check out bynk-lang/starter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bynk-lang/starter
          path: .starter
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      # The script has no dependencies, so no `npm ci`.
      - run: node scripts/check-snippets.mjs .showcase --repo starter=.starter

  proxy:
    name: Proxy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 22.18+ runs the TypeScript tests directly (type stripping).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Bundles the Worker and checks wrangler.toml without deploying.
      - run: npx wrangler deploy --dry-run --outdir dist
