# Build the blog and upload it to its Cloudflare Pages project, after CI
# passes on a push to main, and once a day. Modelled on bynk-lang/bynk's
# deploy-site.yml.
#
# The daily build publishes scheduled posts: a post dated after the build is
# treated as a draft (src/content.config.ts), so it appears in the first build
# on or after its date, without a new commit.
#
# Where the blog is served is set by two repository variables, read at build
# time by astro.config.mjs:
#   BLOG_SITE  the origin (default https://bynk-lang.org)
#   BLOG_BASE  the path the blog lives under (default /blog)
# With the defaults, every URL sits under /blog/, ready to be routed from the
# bynk-lang.org zone. For a subdomain, set BLOG_SITE=https://blog.bynk-lang.org
# and BLOG_BASE=/.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Every day at 05:17 UTC (05:17 GMT, 06:17 BST), so a post dated today is up
  # by morning in the UK. GitHub runs a schedule on the default branch only, and
  # pauses it after 60 days without activity in the repository.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Read CI runs, for the scheduled deploy's check that CI passed on main.
  actions: read
  # Read @bynk-lang/site-theme from GitHub Packages.
  packages: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy to Cloudflare Pages
    # `workflow_run` runs with this repository's secrets and checks out the
    # triggering run's commit, so only a green CI run for a push to this
    # repository's own main may deploy. A pull request (from a fork's `main`
    # too) never matches. See the note in bynk-lang/bynk's deploy-site.yml.
    # A scheduled or manual run builds main as it stands. A scheduled run first
    # checks that CI passed on that commit (the "CI passed on main" step).
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The token is only ever attached to the wrangler step. This step exposes
      # a boolean, so the build still runs (and stays green) before the
      # Cloudflare secrets are added.
      - name: Check for Cloudflare secrets
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # A push deploy waits for CI (the workflow_run trigger above). A scheduled
      # one builds main as it stands, so it first checks that CI passed on that
      # commit: a direct push, or a run still going at 05:17, must not deploy.
      - name: CI passed on main
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch main \
            --event push --commit "$GITHUB_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // "none"')
          echo "CI on $GITHUB_SHA: $conclusion"
          if [ "$conclusion" != success ]; then
            echo "::error::CI hasn't passed on main at $GITHUB_SHA ($conclusion), so the scheduled deploy is skipped."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          # The site theme comes from GitHub Packages.
          registry-url: https://npm.pkg.github.com
          scope: "@bynk-lang"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `npm run build` passes --force, so the content cache never keeps a
      # scheduled post hidden after its date. Don't cache node_modules/.astro.
      # Search also covers the docs site, whose index is beside the blog's on
      # bynk-lang.org (web presence slice 7). Pagefind loads a merged index
      # with this site's code and returns no results at all when that fails,
      # so the merge is turned on only when the live docs index was built with
      # the same Pagefind minor version. Otherwise this deploy searches the
      # blog alone, and says so.
      - name: Decide whether search merges the docs site's index
        id: merge
        run: |
          # Pagefind comes in through Starlight, so it is only here because npm
          # hoists it; a missing copy warns rather than failing the step.
          here=$(node -p "require('./node_modules/pagefind/package.json').version" 2>/dev/null || echo unknown)
          url=https://bynk-lang.org/pagefind/pagefind-entry.json
          if ! there=$(curl -fsS --max-time 20 "$url" | node -pe "JSON.parse(require('fs').readFileSync(0)).version"); then
            echo "::warning::Could not read the docs site's Pagefind version from $url: search will cover the blog alone."
            echo "flag=" >> "$GITHUB_OUTPUT"
          elif [ "$(echo "$here" | cut -d. -f1,2)" != "$(echo "$there" | cut -d. -f1,2)" ]; then
            echo "::warning::Pagefind here is $here, the docs site's is $there: search will cover the blog alone until they match (update the older site's Starlight, or npm update pagefind)."
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "Pagefind $here here, $there on the docs site: search covers both."
            echo "flag=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the site
        env:
          BLOG_SITE: ${{ vars.BLOG_SITE }}
          BLOG_BASE: ${{ vars.BLOG_BASE }}
          BYNK_MERGE_SEARCH: ${{ steps.merge.outputs.flag }}
        # An unset variable arrives as an empty string, which astro.config.mjs
        # treats as "use the default".
        run: npm run build
      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.112.0 pages deploy dist --project-name=bynk-blog --branch=main
      - name: Note when deploy was skipped
        if: steps.gate.outputs.present == 'false'
        run: echo "::notice::Cloudflare secrets not set — built dist/ but skipped the upload. See README.md."
