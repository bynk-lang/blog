ass="bynk-sedge bynk-sedge--assembly"><path class="bynk-hit" d="M708,112 L809,112"/><path class="bynk-sedge-line" d="M708,112 L809,112"/></g><g class="bynk-sedge bynk-sedge--assembly"><path class="bynk-hit" d="M708,170 L763,170 L763,125 L809,125"/><path class="bynk-sedge-line" d="M708,170 L763,170 L763,125 L809,125"/></g><g class="bynk-sedge bynk-sedge--assembly"><path class="bynk-hit" d="M708,228 L773,228 L773,138 L809,138"/><path class="bynk-sedge-line" d="M708,228 L773,228 L773,138 L809,138"/></g></g><g class="bynk-sports"><g class="bynk-port bynk-port--provided"><rect class="bynk-ref-hit" x="132" y="219" width="82" height="28"/><rect class="bynk-port-box" x="184" y="219" width="12" height="12"/><path class="bynk-port-stem" d="M184,225 H178"/><circle class="bynk-port-ball" cx="173" cy="225" r="5"/><text class="bynk-port-label" x="157.5" y="243.5" text-anchor="middle">api · http</text></g><g class="bynk-port bynk-port--required"><rect class="bynk-ref-hit" x="678" y="106" width="65" height="28"/><rect class="bynk-port-box" x="696" y="106" width="12" height="12"/><path class="bynk-port-stem" d="M708,112 H714"/><path class="bynk-port-socket" d="M721,105 A7,7 0 0,0 721,119"/><text class="bynk-port-label" x="726" y="130.5" text-anchor="middle">Fetch</text></g><g class="bynk-port bynk-port--required"><rect class="bynk-ref-hit" x="678" y="164" width="75" height="28"/><rect class="bynk-port-box" x="696" y="164" width="12" height="12"/><path class="bynk-port-stem" d="M708,170 H714"/><path class="bynk-port-socket" d="M721,163 A7,7 0 0,0 721,177"/><text class="bynk-port-label" x="731" y="188.5" text-anchor="middle">Secrets</text></g><g class="bynk-port bynk-port--required"><rect class="bynk-ref-hit" x="678" y="222" width="72" height="28"/><rect class="bynk-port-box" x="696" y="222" width="12" height="12"/><path class="bynk-port-stem" d="M708,228 H714"/><path class="bynk-port-socket" d="M721,221 A7,7 0 0,0 721,235"/><text class="bynk-port-label" x="729.5" y="246.5" text-ancho