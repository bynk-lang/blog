"5"/><text class="bynk-port-label" x="240.5" y="132.5" text-anchor="middle">checkout</text></g><g class="bynk-port bynk-port--required"><rect class="bynk-ref-hit" x="484" y="108" width="71" height="28"/><rect class="bynk-port-box" x="502" y="108" width="12" height="12"/><path class="bynk-port-stem" d="M514,114 H520"/><path class="bynk-port-socket" d="M527,107 A7,7 0 0,0 527,121"/><text class="bynk-port-label" x="535" y="132.5" text-anchor="middle">Events</text></g></g></svg>