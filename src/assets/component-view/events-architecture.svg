 L454,141 L464,141" marker-end="url(#bynk-struct-open)"/></g><g class="bynk-sedge bynk-sedge--wires"><path class="bynk-hit" d="M444,68.7 L738,68.7 L738,111 L784,111"/><path class="bynk-sedge-line" d="M444,68.7 L738,68.7 L738,111 L784,111" marker-end="url(#bynk-struct-open)"/><rect class="bynk-sedge-label-box" x="683" y="73.7" width="42" height="23" rx="2"/><text class="bynk-sedge-label" x="704" y="89.2" text-anchor="middle">Clock</text></g><g class="bynk-sedge bynk-sedge--wires"><path class="bynk-hit" d="M605,124 L784,124"/><path class="bynk-sedge-line" d="M605,124 L784,124" marker-end="url(#bynk-struct-open)"/><rect class="bynk-sedge-label-box" x="680" y="129" width="48" height="23" rx="2"/><text class="bynk-sedge-label" x="704" y="144.5" text-anchor="middle">Events</text></g><g class="bynk-sedge bynk-sedge--wires"><path class="bynk-hit" d="M444,180.3 L738,180.3 L738,137 L784,137"/><path class="bynk-sedge-line" d="M444,180.3 L738,180.3 L738,137 L784,137" marker-end="url(#bynk-struct-open)"/><rect class="bynk-sedge-label-box" x="683" y="185.3" width="42" height="23" rx="2"/><text class="bynk-sedge-label" x="704" y="200.8" text-anchor="middle">Clock</text></g><g class="bynk-sedge bynk-sedge--emits"><path class="bynk-hit" d="M464,124 L160,124 L160,93 L140,93"/><path class="bynk-sedge-line" d="M464,124 L160,124 L160,93 L140,93" marker-end="url(#bynk-struct-open)"/></g><g class="bynk-sedge bynk-sedge--subscribes"><path class="bynk-hit" d="M140,80 L241,80"/><path class="bynk-sedge-line" d="M140,80 L241,80" marker-end="url(#bynk-struct-open)"/><rect class="bynk-sedge-label-box" x="170" y="54" width="51" height="23" rx="2"/><text class="bynk-sedge-label" x="195.5" y="69.5" text-anchor="middle">pattern</text></g><g class="bynk-sedge bynk-sedge--subscribes"><path class="bynk-hit" d="M140,106 L150,106 L150,169 L241,169"/><path class="bynk-sedge-line" d="M140,106 L150,106 L150,169 L241,169" marker-end="url(#bynk-struct-open)"/></g></g><g class="bynk-sports"/></svg>